name: Deploy

# Manual deploy to Cloudflare. Setup steps: docs/deployment-guide.md, Part 3.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

defaults:
  run:
    # -e and -o pipefail: a failed command inside a pipe still fails the step.
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      AZURE_SPEECH_REGION: ${{ vars.AZURE_SPEECH_REGION }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Use npm 11
        run: npm install -g npm@11.20.0

      - name: Check settings
        run: node tools/deploy/src/cli.ts check-env
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          PAIRING_CODE: ${{ secrets.PAIRING_CODE }}

      - name: Install
        run: npm ci

      - name: Type check, lint, test
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build
        run: npm run build

      - name: Key scan
        run: npm run scan:keys
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}

      - name: Prepare the D1 database
        run: node tools/deploy/src/cli.ts resolve-d1 apps/worker

      - name: Apply database migrations
        working-directory: apps/worker
        run: npx wrangler d1 migrations apply pronunciation-coach --remote

      - name: Deploy the Worker and the app
        id: deploy
        env:
          AZURE_SPEECH_KEY: ${{ secrets.AZURE_SPEECH_KEY }}
          PAIRING_CODE: ${{ secrets.PAIRING_CODE }}
        run: |
          secrets_file="$RUNNER_TEMP/worker-secrets.json"
          trap 'rm -f "$secrets_file"' EXIT
          node tools/deploy/src/cli.ts write-secrets "$secrets_file"
          (cd apps/worker && npx wrangler deploy --secrets-file "$secrets_file" --var "AZURE_SPEECH_REGION:$AZURE_SPEECH_REGION") | tee "$RUNNER_TEMP/deploy.log"
          url="$(node tools/deploy/src/cli.ts url < "$RUNNER_TEMP/deploy.log")"
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 --retry-all-errors "${{ steps.deploy.outputs.url }}/api/health"

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo ""
            echo "App: ${{ steps.deploy.outputs.url }}"
            echo ""
            echo "Open it in Chrome on your phone, install it, and pair with your PAIRING_CODE."
          } >> "$GITHUB_STEP_SUMMARY"
